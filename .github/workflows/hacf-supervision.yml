# HACF fork: build the supervision service image (src/hacf-supervision).
#
# Independent of the Meet version: rebuilt when its code changes on `hacf`
# (or manually), published as ghcr.io/<owner>/meet-supervision:latest and
# :sha-<commit>. No deployment.
name: HACF supervision image
run-name: HACF supervision image

on:
  push:
    branches:
      - hacf
    paths:
      - src/hacf-supervision/**
      - .github/workflows/hacf-supervision.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: hacf-supervision-image
  cancel-in-progress: true

env:
  IMAGE_NAME: meet-supervision

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish the image on GHCR
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      -
        name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      -
        name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./src/hacf-supervision
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
